c_compiler:
- if: target_platform == 'linux-64'
  then: gcc
- if: target_platform == 'linux-aarch64'
  then: gcc
- if: target_platform == 'linux-ppc64le'
  then: gcc
- if: target_platform == 'osx-64'
  then: clang
- if: target_platform == 'osx-arm64'
  then: clang
- if: target_platform == 'win-64'
  then: vs2022
c_compiler_version:
- if: target_platform == 'linux-64'
  then: '15'
- if: target_platform == 'linux-aarch64'
  then: '15'
- if: target_platform == 'linux-ppc64le'
  then: '15'
- if: target_platform == 'osx-64'
  then: '21'
- if: target_platform == 'osx-arm64'
  then: '21'
- if: target_platform == 'win-64'
  then: null
c_stdlib:
- if: target_platform == 'linux-64'
  then: sysroot
- if: target_platform == 'linux-aarch64'
  then: sysroot
- if: target_platform == 'linux-ppc64le'
  then: sysroot
- if: target_platform == 'osx-64'
  then: macosx_deployment_target
- if: target_platform == 'osx-arm64'
  then: macosx_deployment_target
- if: target_platform == 'win-64'
  then: vs
c_stdlib_version:
- if: target_platform == 'linux-64'
  then: '2.17'
- if: target_platform == 'linux-aarch64'
  then: '2.17'
- if: target_platform == 'linux-ppc64le'
  then: '2.17'
- if: target_platform == 'osx-64'
  then: '11.0'
- if: target_platform == 'osx-arm64'
  then: '11.0'
- if: target_platform == 'win-64'
  then: null
channel_targets:
- gnuradio-oot-forge main
cxx_compiler:
- if: target_platform == 'linux-64'
  then: gxx
- if: target_platform == 'linux-aarch64'
  then: gxx
- if: target_platform == 'linux-ppc64le'
  then: gxx
- if: target_platform == 'osx-64'
  then: clangxx
- if: target_platform == 'osx-arm64'
  then: clangxx
- if: target_platform == 'win-64'
  then: vs2022
cxx_compiler_version:
- if: target_platform == 'linux-64'
  then: '15'
- if: target_platform == 'linux-aarch64'
  then: '15'
- if: target_platform == 'linux-ppc64le'
  then: '15'
- if: target_platform == 'osx-64'
  then: '21'
- if: target_platform == 'osx-arm64'
  then: '21'
- if: target_platform == 'win-64'
  then: null
gnuradio_core:
- 3.10.12
libboost_devel:
- '1.90'
numpy:
- '2'
python:
- 3.11.* *_cpython
- 3.12.* *_cpython
- 3.13.* *_cp313
- 3.14.* *_cp314
volk:
- '3.3'
